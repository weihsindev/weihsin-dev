  - 我從業務與採購轉進後端開發。近四年在和潤企業獨立負責三套金融資訊系統的開發與維運，做的是那種必須自己把需求、架構、資料庫和正式環境一起扛起來的工作。
  - 先前的業務與採購經歷，讓我習慣從使用單位和流程的角度理解需求，而不是等規格書。

