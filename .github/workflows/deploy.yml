# 建置靜態站並部署到 Cloudflare Workers。
#
# 為什麼不用 Cloudflare 的 Git 整合:那是一條額外的連線,斷掉時不會通知你。
# docs-weihsin-dev 就這樣安靜壞過一次,連線斷掉後推了好幾個 commit 都沒有部署。
# 這個站是履歷入口,安靜失敗的代價最高 —— 改了履歷以為上線了,其實沒有。
# Actions 的觸發是 repo 內建的,沒有可以斷掉的連線;失敗會是紅色的 ✗。
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同站一次只部署一版,讓進行中的上傳與驗證完成;待執行的舊工作會被新工作取代。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # ci 而不是 install:完全照 package-lock,不會在 CI 裡悄悄升版。
      # 跳過 Playwright 的瀏覽器下載:CI 只跑 build(檢查 PDF 是否過期),
      # 產生 PDF 是本機 npm run pdf 的事,這裡下載瀏覽器是純粹的浪費。
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm test

      # build 末端的 check-pdf-fresh.mjs 會在資料、版面或列印流程改了但 PDF 沒重出時
      # 以 exit 1 擋下來,這裡刻意讓它擋 —— 履歷內容和 PDF 不一致比部署失敗更糟。
      - run: npm run build

      - run: npm run check:site

      # 排隊或手動重跑的舊版本不得覆蓋 main 的新版。
      - name: Check latest main commit
        id: latest
        run: |
          latest_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skip outdated commit $GITHUB_SHA; main is $latest_sha"
          fi

      - name: Stamp deployment version
        if: steps.latest.outputs.deploy == 'true'
        run: |
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("dist/version.json", JSON.stringify({ commit: process.env.GITHUB_SHA }) + "\n");'

      - run: npx wrangler deploy
        if: steps.latest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live deployment
        if: steps.latest.outputs.deploy == 'true'
        env:
          SITE_URL: https://weihsin.dev
        run: |
          for attempt in {1..6}; do
            live_sha=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 \
              -H 'Cache-Control: no-cache' \
              "$SITE_URL/version.json?run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT&attempt=$attempt" \
              | jq -er '.commit') || live_sha='unavailable'
            if [ "$live_sha" = "$GITHUB_SHA" ]; then
              echo "Verified $SITE_URL at $GITHUB_SHA"
              exit 0
            fi
            echo "Attempt $attempt: expected $GITHUB_SHA, got $live_sha"
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "::error::Live deployment does not match $GITHUB_SHA"
          exit 1

      - name: Check live homepage and PDF
        if: steps.latest.outputs.deploy == 'true'
        run: npm run check:site -- https://weihsin.dev
