projects_intro: 以下系統均為和潤企業任內獨立或主導交付。

# 03 Selected Work。內容原本是 experience 底下的 highlights，搬出來自成一節:
# 02 回答「在哪待過多久」，03 回答「做出了什麼」。不要在兩邊各放一份。
projects:
  - title: 金融進件系統及後段系統
    detail: 獨立負責開發與維運。為了準確定位問題，需要同時理解既有程式架構、資料流程，以及不同金融商品的業務規則。
  # 債權回收系統與「ASP.NET Core 現代化」原本分列兩項，實際是同一套(2025-06 起，開發至維運約一年)。
  # 資歷表只有一套，分列會被讀成兩個專案 —— 不要再拆回去。
  - title: 債權回收系統(ASP.NET Core)
    detail: 既有系統缺少特定後段處理能力，主導新系統建立。梳理跨系統影響範圍，完成架構設計與模組切割，參考並調整既有 ASP.NET MVC 的架構模式，獨立交付建置、開發、Razor 與 TypeScript 整合、部署及後續維運。
  - title: Stored Procedure 優化
    detail: 既有系統的商業邏輯大量集中於 SP，拆解並優化複雜 SP 的架構，改善報表與批次作業的執行效能。
  # 這一項不是系統，是橫跨三套系統的工作方式，所以標題刻意不帶「系統」。
  - title: 需求與異常分析
    detail: 與使用單位確認需求及異常情境，追查資料來源、商業規則與系統流程，完成問題分析與修正。

